# Chimera — Zerops application deployment (the five app runtime services).
#
# The managed backing services are provisioned SEPARATELY — see
# infra/zerops-project-import.yml — and MUST use these hostnames so the
# ${<hostname>_<var>} references below resolve (same-project cross-service env):
#   - PostgreSQL     -> hostname: db       (exposes ${db_connectionString})
#   - NATS           -> hostname: nats     (exposes ${nats_connectionString})
#   - Valkey         -> hostname: valkey   (exposes ${valkey_connectionString})
#   - Object storage -> hostname: storage  (exposes ${storage_apiUrl},
#                        ${storage_bucketName}, ${storage_accessKeyId},
#                        ${storage_secretAccessKey})
#
# NOTE: Zerops NATS requires authentication, so NATS_URL uses the credentialed
# ${nats_connectionString} (nats://user:pass@host:4222). packages/transport
# connectNats() lifts these credentials into explicit auth options, because
# nats.js does not read them from the server URL. Valkey's URL creds are
# consumed by ioredis as-is (no code change needed).
#
# Budget: free Lightweight core; shared CPU + 0.25 GB RAM per service.
# All tsx services ship source + node_modules via `deployFiles: ./` and run with tsx.

zerops:
  # --- Control plane: REST + WebSocket (public HTTP, port 3000) ---------------
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm i -g pnpm
        - pnpm install --frozen-lockfile
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true # public HTTP + WebSocket upgrade on /ws
      envVariables:
        NODE_ENV: production
        PORT: '3000'
        DATABASE_URL: '${db_connectionString}'
        NATS_URL: '${nats_connectionString}'
        VALKEY_URL: '${valkey_connectionString}'
        S3_ENDPOINT: '${storage_apiUrl}'
        S3_BUCKET: '${storage_bucketName}'
        S3_ACCESS_KEY: '${storage_accessKeyId}'
        S3_SECRET_KEY: '${storage_secretAccessKey}'
        # JWT_SECRET is set as a SECRET env var on this service in the dashboard.
      initCommands:
        # Idempotent: drizzle-kit migrate applies only pending migrations;
        # every seed uses ON CONFLICT DO NOTHING, so re-running on each start is safe.
        - pnpm db:migrate
        - pnpm db:seed
        - pnpm db:seed:demo
        - pnpm db:seed:intel
      healthCheck:
        httpGet:
          port: 3000
          path: /healthz
      start: pnpm --filter @chimera/api start

  # --- Dashboard: static SvelteKit build (public HTTP) -----------------------
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm i -g pnpm
        - pnpm install --frozen-lockfile
        - pnpm --filter @chimera/web build
      deployFiles: apps/web/build
      # VITE_API_URL must equal the api's PUBLIC URL at build time. Set it as an
      # env var on this `web` service in the dashboard, then redeploy web, e.g.
      #   VITE_API_URL=https://<api-public-subdomain>
      # (P1: the client derives both the REST base and the WS URL from it.)
    run:
      base: static

  # --- Hero decoy: SSH honeypot (public TCP 2222) ----------------------------
  - setup: decoy-ssh
    build:
      base: nodejs@22
      buildCommands:
        - npm i -g pnpm
        - pnpm install --frozen-lockfile
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 2222 # raw TCP (no httpSupport) so attackers reach the SSH server
      envVariables:
        NATS_URL: '${nats_connectionString}'
        DECOY_SSH_PORT: '2222'
        # DECOY_ID defaults in code to the seeded demo ssh decoy id.
      start: pnpm --filter @chimera/decoy-ssh start

  # --- Second decoy: fake HTTP admin panel (public HTTP 8080) -----------------
  - setup: decoy-http
    build:
      base: nodejs@22
      buildCommands:
        - npm i -g pnpm
        - pnpm install --frozen-lockfile
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 8080
          httpSupport: true # public HTTP; attackers browse the fake login
      envVariables:
        NATS_URL: '${nats_connectionString}'
        DECOY_HTTP_PORT: '8080'
        # DECOY_HTTP_ID defaults in code to the seeded demo http decoy id.
      healthCheck:
        httpGet:
          port: 8080
          path: /
      start: pnpm --filter @chimera/decoy-http start

  # --- Enrichment worker: NO public port -------------------------------------
  - setup: worker-enrich
    build:
      base: nodejs@22
      buildCommands:
        - npm i -g pnpm
        - pnpm install --frozen-lockfile
      deployFiles: ./
    run:
      base: nodejs@22
      envVariables:
        DATABASE_URL: '${db_connectionString}'
        NATS_URL: '${nats_connectionString}'
        S3_ENDPOINT: '${storage_apiUrl}'
        S3_BUCKET: '${storage_bucketName}'
        S3_ACCESS_KEY: '${storage_accessKeyId}'
        S3_SECRET_KEY: '${storage_secretAccessKey}'
      start: pnpm --filter @chimera/worker-enrich start
